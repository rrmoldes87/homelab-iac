sources:
  docker_logs:
    type: docker_logs
    exclude_containers:
      - homelab-vector-logs

transforms:
  add_host:
    type: remap
    inputs: ["docker_logs"]
    source: |
      .host = "vm103-compose-core"
      if !exists(.container_name) { .container_name = "unknown" }

sinks:
  victorialogs:
    type: http
    inputs: ["add_host"]
    uri: "http://192.168.1.97:9428/insert/jsonline?_stream_fields=host,container_name&_msg_field=message&_time_field=timestamp"
    encoding:
      codec: json
    framing:
      method: newline_delimited
    compression: gzip
    batch:
      max_bytes: 1048576
      timeout_secs: 5
    healthcheck:
      enabled: false
