name: IaC Guard (Syntax & Secret Scan)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-iac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run IaC syntax and secret validation
        run: python3 tools/validate_iac.py
